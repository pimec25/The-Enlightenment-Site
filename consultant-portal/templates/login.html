<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultant sign in</title><link rel="stylesheet" href="/static/portal.css"></head>
<body><main class="login-shell"><section class="card login-card"><p class="eyebrow">PIMECINENG</p><h1>Consultant portal</h1><p class="muted">Sign in to analyze confidential sales and P&amp;L workbooks.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/consultant/login"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section></main></body></html>
